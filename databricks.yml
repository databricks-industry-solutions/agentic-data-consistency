bundle:
  name: agentic-data-consistency

variables:
  project_name:
    description: "Name of the solution accelerator"
    default: "agentic-data-consistency"

  # The SQL warehouse the app queries through and the dashboard runs on.
  warehouse_id:
    lookup:
      # Replace this with the name of your SQL warehouse.
      warehouse: "Shared Unity Catalog Serverless"

  # Deployment environment used in workspace paths
  environment:
    description: "Deployment environment (dev, staging, prod)"
    default: "dev"

  # Must match DQ_APP_CATALOG / DQ_APP_SCHEMA in apps/dq-proposal-agent/backend/app.yaml.
  app_catalog:
    description: "Catalog that holds the app's state schema (must already exist)"
    default: "main"
  app_schema:
    description: "Schema for the app's state tables, reports volume and traces"
    default: "dq_app"

  # Optional: the schema you want the agent to scan. The setup job grants the
  # app's service principal read access on it (needed when DQ_AUTH_MODE=sp).
  target_catalog:
    description: "Catalog of the schema to scan (optional)"
    default: ""
  target_schema:
    description: "Schema to scan (optional)"
    default: ""

# backend/static/ (the built frontend, see scripts/build_frontend.sh) is
# gitignored, so it has to be included explicitly.
sync:
  include:
    - apps/dq-proposal-agent/backend/static/**

targets:
  dev:
    default: true
    mode: development

resources:
  apps:
    dq_proposal_agent:
      name: "dq-proposal-agent"
      description: "Proposes data-quality checks for a Unity Catalog schema and turns approvals into DBSQL Alerts"
      # Runtime settings come from app.yaml in this folder.
      source_code_path: ./apps/dq-proposal-agent/backend
      resources:
        - name: warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
      # For OBO mode (DQ_AUTH_MODE=obo), add user-authorization scopes. See docs/AUTHORIZATION.md.
      # user_api_scopes:
      #   - sql
      #   - genie

  dashboards:
    dq_findings:
      display_name: "DQ Findings – Proposals & Issues"
      file_path: ./dashboards/dq_findings.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.app_catalog}
      dataset_schema: ${var.app_schema}

  jobs:
    setup:
      name: "${var.project_name} - Setup"
      tasks:
        - task_key: setup_grants
          notebook_task:
            notebook_path: ./notebooks/01_setup_grants.py
            base_parameters:
              app_name: ${resources.apps.dq_proposal_agent.name}
              app_catalog: ${var.app_catalog}
              app_schema: ${var.app_schema}
              target_catalog: ${var.target_catalog}
              target_schema: ${var.target_schema}

# For more options and schema, see: https://docs.databricks.com/aws/en/dev-tools/bundles/settings
